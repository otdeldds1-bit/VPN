name: Update config hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update script
        run: bash update.sh

      - name: Commit and push changes to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-update config $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Push to SourceCraft
        run: |
          git remote remove sourcecraft || true
          git remote add sourcecraft https://git:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/otdeldds1-gmail-com/config-vpn.git
          git push -f sourcecraft HEAD:main
