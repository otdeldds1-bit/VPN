name: Update config hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update script
        run: bash update.sh

      - name: Commit and push changes to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-update config $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Update only config.txt in SourceCraft
        run: |
          # Клонируем репозиторий SourceCraft в отдельную папку
          git clone https://git:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/otdeldds1-gmail-com/config-vpn.git sourcecraft-repo
          cd sourcecraft-repo

          # Копируем ТОЛЬКО config.txt из GitHub-версии
          cp ../config.txt config.txt

          # Настраиваем git
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Добавляем в индекс только config.txt
          git add config.txt

          # Если файл не изменился — ничего не делаем
          if git diff --cached --quiet; then
            echo "No changes in config.txt, nothing to push."
            exit 0
          fi

          # Коммитим и пушим
          git commit -m "Auto-update config $(date +'%Y-%m-%d %H:%M')"
          git push origin main
