name: Update config hourly

on:
  schedule:
    - cron: '0 * * * *'   # каждый час в 0 минут UTC
  workflow_dispatch:       # возможность запустить вручную

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x update.sh

      - name: Run update script
        run: ./update.sh

      - name: Commit and push changes to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add config.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update config $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Push to SourceCraft
        run: |
          git remote remove sourcecraft || true
          git remote add sourcecraft https://git:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/otdeldds1-gmail-com/config-vpn.git
          git push sourcecraft HEAD:main
